name: PerPlayerProfiles
version: '${version}'
main: es.mrdino.perplayerprofiles.PerPlayerProfilesPlugin
api-version: '${apiVersion}'
author: MrDino
description: Multiple server profiles per Minecraft account.
softdepend:
  - ServerPassword
  - ViaVersion
  - Geyser-Spigot
commands:
  profiles:
    description: Manage player profiles.
    usage: /profiles [gui|list|create|use|settings|icon|mode|language|delete|lock|unlock|setmasterpassword|setlimit|admin|reload|help]
    aliases:
      - ppp
      - pprofile
      - perfil
      - perfiles
permissions:
  perplayerprofiles.admin:
    description: Allows administrative profile operations.
    default: op
